# =============================================================================
# CRAN RELEASE — RBMRB
# Triggered when you create a GitHub Release (tag like v3.0.0).
# Runs a strict --as-cran check, builds the tarball, and attaches it
# to the GitHub Release as a downloadable asset.
#
# Usage:
#   git tag v3.0.0
#   git push origin v3.0.0
#   Then create a Release from the tag in GitHub UI.
# =============================================================================

name: cran-release

on:
  release:
    types: [published]

jobs:
  cran-release:
    name: CRAN release check and package build
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write     # needed to upload release assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # Use R-devel — this is what CRAN's win-builder uses
      - name: Set up R (devel)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version:       devel
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown

      # ── Strict CRAN check ──────────────────────────────────────────────────
      - name: Run R CMD CHECK --as-cran
        uses: r-lib/actions/check-r-package@v2
        with:
          args:       '"--as-cran", "--no-manual"'
          build_args: '"--no-manual"'
          error-on:   '"error"'      # fail only on errors (notes/warnings shown)

      # ── Build submission tarball ───────────────────────────────────────────
      - name: Build source tarball
        run: |
          pkg <- devtools::build(path = ".", binary = FALSE, quiet = FALSE)
          cat("Built:", pkg, "\n")
          writeLines(pkg, "tarball_path.txt")
        shell: Rscript {0}

      - name: Read tarball path
        id: tarball
        run: echo "path=$(cat tarball_path.txt)" >> $GITHUB_OUTPUT

      # ── Attach tarball to the GitHub Release ──────────────────────────────
      - name: Upload tarball to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.tarball.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Print CRAN submission reminder ────────────────────────────────────
      - name: Remind about CRAN submission
        run: |
          echo "============================================"
          echo " CRAN check passed for RBMRB ${{ github.ref_name }}"
          echo " Tarball attached to GitHub Release."
          echo " Submit at: https://cran.r-project.org/submit.html"
          echo "============================================"
