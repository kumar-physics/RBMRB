# =============================================================================
# R CMD CHECK — RBMRB
# Runs on every push and pull request.
# Tests on Ubuntu (devel + release), macOS (release), and Windows (release).
# =============================================================================

name: R-CMD-check

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false          # keep running other OSes even if one fails
      matrix:
        config:
          # Ubuntu — test on R-devel (what CRAN uses) and current release
          - { os: ubuntu-latest,  r: "devel",   http-user-agent: "release" }
          - { os: ubuntu-latest,  r: "release" }
          # macOS — Apple Silicon (same as CRAN macOS arm)
          - { os: macos-latest,   r: "release" }
          # Windows — CRAN uses win-builder which runs R-release + R-devel
          - { os: windows-latest, r: "release" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes     # keeps source for better stack traces

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up Pandoc (needed for vignettes) ────────────────────────────────
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # ── Set up R ────────────────────────────────────────────────────────────
      - name: Set up R ${{ matrix.config.r }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version:        ${{ matrix.config.r }}
          http-user-agent:  ${{ matrix.config.http-user-agent }}
          use-public-rspm:  true   # faster binary installs on Linux

      # ── Install system dependencies (Linux only) ────────────────────────────
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      # ── Cache R packages ─────────────────────────────────────────────────────
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ matrix.config.r }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ matrix.config.r }}-

      # ── Install package dependencies ─────────────────────────────────────────
      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::knitr
            any::rmarkdown

      # ── Run R CMD CHECK ──────────────────────────────────────────────────────
      - name: Run R CMD CHECK
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: '"--no-manual"'
          args: '"--as-cran", "--no-manual"'

      # ── Upload check results on failure ─────────────────────────────────────
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results-${{ matrix.config.os }}-r${{ matrix.config.r }}
          path: check
