# =============================================================================
# PKGDOWN — RBMRB
# Builds a documentation website and deploys it to GitHub Pages.
# Runs on push to main/master (not on PRs — only deploy from the main branch).
#
# Setup steps (one-time):
#   1. Run usethis::use_pkgdown_github_pages() in your R project
#   2. In GitHub → Settings → Pages → Source → "Deploy from a branch"
#      and select "gh-pages"
# =============================================================================

name: pkgdown

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:       # allows manual trigger from GitHub Actions UI

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    name: Build and deploy pkgdown site
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    # Only publish to gh-pages when pushing to main (not on PRs)
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R (release)
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev \
                                   libxml2-dev libharfbuzz-dev \
                                   libfribidi-dev libfreetype6-dev \
                                   libpng-dev libtiff5-dev libjpeg-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ubuntu-r-release-pkgdown-${{ hashFiles('DESCRIPTION') }}

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            local::.

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean:  true
          branch: gh-pages
          folder: docs
